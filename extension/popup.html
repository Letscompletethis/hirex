<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HireX import</title></head>
<body>
  <main>
    <h1>Import to HireX</h1>
    <p>Enter information you selected and provide yourself. This extension does not read or scrape LinkedIn pages.</p>
    <label>HireX API URL <input id="apiUrl" type="url" placeholder="https://your-hirex.example.com"></label>
    <label>Bearer token <input id="token" type="password" autocomplete="off"></label>
    <label>First name <input id="firstName" autocomplete="given-name"></label>
    <label>Last name <input id="lastName" autocomplete="family-name"></label>
    <label>Email <input id="email" type="email" autocomplete="email" required></label>
    <label>Phone <input id="phone" type="tel" autocomplete="tel"></label>
    <label>Current job title <input id="currentJobTitle"></label>
    <button id="import" type="button">Import selected information</button>
    <output id="result" role="status"></output>
  </main>
  <script src="popup.js"></script>
</body>
</html>
